# Tag push → test → sync version from tag → build → publish to npm.
#
# Prerequisites (GitHub repo secrets):
#   NPM_TOKEN — npm Access Token (Automation) with publish permission
#
# Setup:
#   1. https://www.npmjs.com → Access Tokens → Generate New Token → Granular or Classic (Automation)
#   2. GitHub repo → Settings → Secrets and variables → Actions → New repository secret
#      Name: NPM_TOKEN   Value: <your npm token>
#
# Usage:
#   git tag v1.0.1
#   git push origin v1.0.1

name: Publish npm

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: read

jobs:
  publish:
    name: Test, build & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing chatablex-web-sdk@${VERSION} (tag ${TAG})"

      - name: Sync package.json version
        run: node scripts/sync-version.mjs "${{ steps.version.outputs.version }}"

      - name: Build
        run: npm run build

      - name: Verify published artifacts
        run: |
          test -f dist/index.js
          test -f dist/index.mjs
          test -f dist/index.d.ts
          node -e "
            const pkg = require('./package.json');
            const dist = require('fs').readFileSync('dist/index.js', 'utf8');
            if (pkg.version !== '${{ steps.version.outputs.version }}') process.exit(1);
            if (!dist.includes(pkg.version)) {
              console.error('dist/index.js does not embed package version');
              process.exit(1);
            }
          "

      - name: Validate NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Repository secret NPM_TOKEN is not configured."
            echo "Create an npm Automation token, then add it at:"
            echo "  GitHub → chatablex/chatablex-web-sdk → Settings → Secrets and variables → Actions"
            echo "  Secret name: NPM_TOKEN"
            exit 1
          fi

      - name: Configure npm registry auth
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
