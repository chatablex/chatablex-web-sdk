# Tag push → test → sync version from tag → build → publish to npm.
#
# Prerequisites (GitHub repo secrets):
#   NPM_TOKEN — npm Access Token (Automation) from the `chatablex` npm account
#               that owns https://www.npmjs.com/package/chatablex-web-sdk
#
# Setup:
#   1. https://www.npmjs.com → Access Tokens → Generate New Token → Automation
#   2. GitHub → Settings → Secrets and variables → Actions → NPM_TOKEN
#
# Usage:
#   git tag v1.0.1 && git push origin v1.0.1

name: Publish npm

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: read

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  publish:
    name: Test, build & publish
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_LOGLEVEL: verbose
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          echo "=== npm ci ==="
          npm ci
          echo "=== installed packages ==="
          npm ls --depth=0 || true

      - name: Typecheck
        run: |
          echo "=== npm run typecheck ==="
          npm run typecheck

      - name: Test
        run: |
          echo "=== npm test ==="
          npm test

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing chatablex-web-sdk@${VERSION} (tag ${TAG})"

      - name: Sync package.json version
        run: |
          echo "=== sync version to ${{ steps.version.outputs.version }} ==="
          node scripts/sync-version.mjs "${{ steps.version.outputs.version }}"
          echo "=== package.json version ==="
          node -p "require('./package.json').version"

      - name: Build
        run: |
          echo "=== npm run build ==="
          npm run build
          echo "=== dist contents ==="
          ls -la dist/

      - name: Verify published artifacts
        run: |
          echo "=== verify dist artifacts ==="
          test -f dist/index.js
          test -f dist/index.mjs
          test -f dist/index.d.ts
          node -e "
            const pkg = require('./package.json');
            const dist = require('fs').readFileSync('dist/index.js', 'utf8');
            console.log('package.json version:', pkg.version);
            if (pkg.version !== '${{ steps.version.outputs.version }}') {
              console.error('VERSION MISMATCH: expected ${{ steps.version.outputs.version }}');
              process.exit(1);
            }
            if (!dist.includes(pkg.version)) {
              console.error('dist/index.js does not embed package version');
              process.exit(1);
            }
            console.log('artifact verification passed');
          "

      - name: Validate NPM_TOKEN and diagnose npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "=== validate NPM_TOKEN ==="
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is missing. Add it at GitHub → Settings → Secrets → Actions"
            exit 1
          fi
          echo "NPM_TOKEN is set (length: ${#NPM_TOKEN})"

          echo "=== configure .npmrc for auth test ==="
          NPMRC_PATH="${RUNNER_TEMP}/.npmrc"
          echo "registry=https://registry.npmjs.org/" > "$NPMRC_PATH"
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$NPMRC_PATH"
          export NPM_CONFIG_USERCONFIG="$NPMRC_PATH"

          echo "=== npm whoami (which account owns this token?) ==="
          if ! NPM_USER="$(npm whoami 2>&1)"; then
            echo "::error::npm whoami failed — token is invalid or expired"
            echo "$NPM_USER"
            exit 1
          fi
          echo "Authenticated as: $NPM_USER"

          echo "=== npm owner ls chatablex-web-sdk ==="
          npm owner ls chatablex-web-sdk 2>&1 || echo "::warning::could not list owners (package may not exist yet)"

          echo "=== npm view chatablex-web-sdk ==="
          npm view chatablex-web-sdk version 2>&1 || echo "package not found on npm (first publish?)"

          if npm view chatablex-web-sdk name &>/dev/null; then
            if npm owner ls chatablex-web-sdk 2>/dev/null | grep -q "$NPM_USER"; then
              echo "Maintainer check passed for $NPM_USER"
            else
              echo "::error::npm user '$NPM_USER' is NOT a maintainer of chatablex-web-sdk."
              echo "::error::Use a token from the 'chatablex' npm account, or run: npm owner add $NPM_USER chatablex-web-sdk"
              exit 1
            fi
          else
            echo "Package not on npm yet — first publish, skipping maintainer check"
          fi

      - name: Configure npm registry auth
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "=== npm publish --access public (verbose) ==="
          echo "package: $(node -p "require('./package.json').name")"
          echo "version: $(node -p "require('./package.json').version")"
          echo "npm whoami: $(npm whoami 2>&1 || echo 'FAILED')"

          set +e
          npm publish --access public --loglevel verbose 2>&1 | tee /tmp/npm-publish.log
          PUBLISH_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$PUBLISH_EXIT" -ne 0 ]; then
            echo "::error::npm publish failed with exit code $PUBLISH_EXIT"
            echo ""
            echo "=== publish stdout/stderr (replay) ==="
            cat /tmp/npm-publish.log || true
            echo ""
            echo "=== npm debug logs ==="
            if ls "$HOME/.npm/_logs/"*-debug-*.log 1>/dev/null 2>&1; then
              for f in "$HOME/.npm/_logs/"*-debug-*.log; do
                echo "--- $f ---"
                cat "$f"
              done
            else
              echo "(no npm debug logs found)"
            fi
            echo ""
            echo "=== common causes ==="
            if grep -q "E404" /tmp/npm-publish.log; then
              echo "::error::E404 usually means: token user lacks publish permission on this package."
              echo "::error::Package owner is 'chatablex'. Token must be from that account or be added as maintainer."
            fi
            if grep -q "ENEEDAUTH" /tmp/npm-publish.log; then
              echo "::error::ENEEDAUTH: NPM_TOKEN is missing or invalid."
            fi
            if grep -q "E403" /tmp/npm-publish.log; then
              echo "::error::E403: forbidden — check token permissions and 2FA settings."
            fi
            exit "$PUBLISH_EXIT"
          fi

          echo "=== publish succeeded ==="
          npm view chatablex-web-sdk version
