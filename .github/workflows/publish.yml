# Tag push → test → sync version from tag → build → publish to npm.
#
# Publishing uses npm Trusted Publishing (OIDC) — no NPM_TOKEN required.
#
# Prerequisites (npmjs.com):
#   chatablex-web-sdk → Settings → Trusted publishing → GitHub Actions
#     Repository:        chatablex/chatablex-web-sdk
#     Workflow filename: publish.yml
#     Environment name:  (leave empty unless workflow sets `environment:`)
#
# Usage:
#   git tag v1.0.1 && git push origin v1.0.1

name: Publish npm

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  id-token: write # required for npm Trusted Publishing (OIDC)
  contents: read

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  publish:
    name: Test, build & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Upgrade npm for Trusted Publishing
        run: |
          echo "=== before upgrade ==="
          node --version
          npm --version
          npm install -g npm@latest
          echo "=== after upgrade ==="
          node --version
          npm --version

      - name: Install dependencies
        run: |
          echo "=== npm ci ==="
          npm ci
          npm ls --depth=0 || true

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing chatablex-web-sdk@${VERSION} (tag ${TAG})"

      - name: Sync package.json version
        run: node scripts/sync-version.mjs "${{ steps.version.outputs.version }}"

      - name: Build
        run: |
          npm run build
          ls -la dist/

      - name: Verify published artifacts
        run: |
          test -f dist/index.js
          test -f dist/index.mjs
          test -f dist/index.d.ts
          node -e "
            const pkg = require('./package.json');
            const dist = require('fs').readFileSync('dist/index.js', 'utf8');
            if (pkg.version !== '${{ steps.version.outputs.version }}') process.exit(1);
            if (!dist.includes(pkg.version)) process.exit(1);
          "

      - name: Configure npm registry for Trusted Publishing
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        shell: bash
        run: bash scripts/publish-npm-ci.sh
